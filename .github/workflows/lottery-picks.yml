name: Lottery picks

# Pulls new results from megamillions.com and powerball.com every morning and
# updates the picks for BOTH games, so the page is current well before the next
# evening's draw.
#
# Draws (California time):
#   Powerball      Mon, Wed, Sat  7:59 PM
#   Mega Millions  Tue, Fri       8:00 PM
# Runs every day at 14:17 UTC (6:17 AM PST / 7:17 AM PDT), with a retry at
# 18:17 UTC in case GitHub skipped the first run. A run that finds no new
# draw commits nothing. Runs are at :17, not :00: GitHub most often delays
# or skips scheduled runs at the top of the hour.
on:
  schedule:
    - cron: "17 14 * * *"
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lottery-picks
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull Mega Millions results and make picks
        run: python project-2-mega-millions/mega_millions.py
      - name: Pull Powerball results and make picks
        run: python project-3-powerball/powerball.py
      - name: Publish both games' picks
        run: python publish_picks.py
      - name: Commit if there was a new draw
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          # Only commit when draw data changed (not just a report timestamp).
          if git diff --quiet -- project-2-mega-millions/data project-3-powerball/data; then
            echo "No new draw yet."
          else
            git add project-2-mega-millions/data project-3-powerball/data \
                    project-2-mega-millions/output/*.json project-2-mega-millions/output/latest_picks.md \
                    project-3-powerball/output/*.json project-3-powerball/output/latest_picks.md \
                    LATEST_PICKS.md
            git commit -m "Update lottery picks after latest draw"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
