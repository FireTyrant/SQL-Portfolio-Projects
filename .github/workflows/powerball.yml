name: Powerball picks

# Draws are Monday, Wednesday & Saturday at 10:59 PM ET. NY open data usually posts the
# result the next morning, so refresh Tuesday, Thursday and Sunday (UTC),
# with an evening retry in case the data was late.
on:
  schedule:
    - cron: "23 15 * * 0,2,4"
    - cron: "23 23 * * 0,2,4"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download draws and generate picks
        working-directory: project-3-powerball
        run: python powerball.py
      - name: Commit updated picks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          # Only commit when the draw data changed (not just the report's timestamp).
          if git diff --quiet -- project-3-powerball/data; then
            echo "No new draw yet."
          else
            git add project-3-powerball/data project-3-powerball/output/latest_picks.md
            git commit -m "Update Powerball picks after latest draw"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
