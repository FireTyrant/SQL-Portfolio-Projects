name: Mega Millions picks

# Draws are Tuesday & Friday at 11:00 PM ET. NY open data usually posts the
# result the next morning, so refresh Wednesday and Saturday afternoons (UTC),
# with an evening retry in case the data was late.
on:
  schedule:
    - cron: "17 15 * * 3,6"
    - cron: "17 23 * * 3,6"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download draws and generate picks
        working-directory: project-2-mega-millions
        run: python mega_millions.py
      - name: Commit updated picks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          # Only commit when the draw data changed (not just the report's timestamp).
          if git diff --quiet -- project-2-mega-millions/data; then
            echo "No new draw yet."
          else
            git add project-2-mega-millions/data project-2-mega-millions/output/latest_picks.md
            git commit -m "Update Mega Millions picks after latest draw"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
